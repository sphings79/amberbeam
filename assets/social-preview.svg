xt><text x="72" y="286" fill="#ffffff" font-size="42" font-weight="700">the keyboard in charge.</text><text x="72" y="334" fill="#9aa2b5" font-size="19">A file transfer client in the tradition of FlashFXP —</text><text x="72" y="360" fill="#9aa2b5" font-size="19">on the Mac, on Windows, on Linux, on your server.</text><circle cx="82" cy="414" r="9" fill="none" stroke="#35c489" stroke-width="2.2"/><path d="M78 414l3 3 5.5-6" stroke="#35c489" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="420" fill="#c8cdda" font-size="17.5">SFTP, FTP and FTPS</text><circle cx="82" cy="454" r="9" fill="none" stroke="#35c489" stroke-width="2.2"/><path d="M78 454l3 3 5.5-6" stroke="#35c489" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="460" fill="#c8cdda" font-size="17.5">Resume a transfer that broke in mid-file</text><circle cx="82" cy="494" r="9" fill="none" stroke="#35c489" stroke-width="2.2"/><path d="M78 494l3 3 5.5-6" stroke="#35c489" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="500" fill="#c8cdda" font-size="17.5">Import sites from FileZilla, WinSCP and FlashFXP</text><rect x="72" y="552" width="88" height="34" rx="17" fill="#1b1f2a" stroke="#2b3040"/><text x="116.0" y="574" fill="#c8cdda" font-size="16" font-weight="500" text-anchor="middle">macOS</text><rect x="168" y="552" width="100" height="34" rx="17" fill="#1b1f2a" stroke="#2b3040"/><text x="218.0" y="574" fill="#c8cdda" font-size="16" font-weight="500" text-anchor="middle">Windows</text><rect x="276" y="552" width="76" height="34" rx="17" fill="#1b1f2a" stroke="#2b3040"/><text x="314.0" y="574" fill="#c8cdda" font-size="16" font-weight="500" text-anchor="middle">Linux</text><rect x="360" y="552" width="88" height="34" rx="17" fill="#33270e" stroke="#6b4a12"/><text x="404.0" y="574" fill="#f0b429" font-size="16" font-weight="500" text-anchor="middle">Docker</text><rect x="456