[package]
name = "amberbeam-desktop"
description = "Desktop shell of AmberBeam. Maps commands onto the core and does nothing else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the library name apart from the binary name, which
# Windows insists on. See https://github.com/rust-lang/cargo/issues/8519
name = "amberbeam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
amberbeam-core.workspace = true
amberbeam-commands.workspace = true
# The third shell, in the same binary: `amberbeam-desktop --mcp` runs it
# instead of building a window. Same program, same keychain entry.
amberbeam-mcp = { path = "../crates/amberbeam-mcp" }
serde.workspace = true
serde_json.workspace = true
# For the one path that has no Tauri runtime to lean on: `--mcp` builds its
# own and never calls the builder at all.
tokio.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2.11.0"
