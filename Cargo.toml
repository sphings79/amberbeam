[workspace]
members = ["crates/amberbeam-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sphings79/amberbeam"
authors = ["sphings79"]

[workspace.dependencies]
amberbeam-core = { path = "crates/amberbeam-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
russh = "0.63"
russh-sftp = "3"
dirs = "7"
# tokio with rustls-ring: the same TLS stack russh already brings, so the
# binary carries one implementation rather than two.
# Already in the tree through russh; declared directly so the fingerprint code
# does not depend on somebody else's dependency staying where it is.
# The credential store of whichever system this runs on. Chosen over writing
# three platform back ends by hand because the Linux one would still be missing.
keyring = { version = "4.2", features = [
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    # zbus rather than dbus: the latter wants libdbus, a C library, and this
    # project carries none. See the note on russh in the concept paper.
    "zbus-secret-service-keyring-store",
    "v1",
] }
sha2 = "0.11"
# The operating system's trust store, so a certificate authority the user
# installed is trusted here as well. Chosen over a bundled list for that reason.
rustls-native-certs = "0.8"
suppaftp = { version = "12", default-features = false, features = ["tokio", "tokio-rustls-ring", "async-secure", "deprecated"] }

# Release profile lives here so both the desktop shell and a future headless
# server binary (milestone M7) are built with the same settings.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
