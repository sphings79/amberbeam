name: Release

# A tag is the trigger, and nothing else is. A release that could be started by
# hand from any branch is a release nobody can later point at a commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Before anything is built: does the tag agree with the version in the files?
  # A release called v0.2.0 carrying a program that calls itself 0.1.0 is worse
  # than no release — the update notice compares the two, and would go on
  # telling everybody about an update they already have.
  agree:
    name: Tag and version agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./src-tauri/tauri.conf.json').version")
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag $tag, tauri.conf.json $declared, Cargo.toml $crate"
          test "$tag" = "$declared" || { echo "::error::tauri.conf.json says $declared"; exit 1; }
          test "$tag" = "$crate" || { echo "::error::Cargo.toml says $crate"; exit 1; }
      - name: The changelog mentions this version
        run: |
          grep -q "## ${GITHUB_REF_NAME#v}" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no entry for ${GITHUB_REF_NAME#v}"; exit 1; }

  build:
    name: Build (${{ matrix.name }})
    needs: agree
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
            artefact: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app.tar.gz
              target/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            name: Windows
            artefact: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.sig
          - os: ubuntu-22.04
            name: Linux
            artefact: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/appimage/*.AppImage.sig
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: release-${{ matrix.os }}
      - name: System libraries for the webview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci

      # Signing and notarisation happen only when the secrets are there. They
      # are not today — there is no paid Apple membership behind this — and the
      # build says so rather than failing, so the day one appears the only
      # change is putting the secrets in the repository settings.
      #
      # The unset loop is the whole trick, and leaving it out cost one tag:
      # a secret that does not exist arrives here as an empty string, and an
      # empty APPLE_CERTIFICATE is not the same as no APPLE_CERTIFICATE — Tauri
      # sees the variable, tries to import a certificate of nothing, and the
      # build dies with "failed to import keychain certificate". Unsetting the
      # empty ones puts this back exactly where CI is, which builds fine.
      - name: Build, signed and notarised where possible
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Not the same thing as the Apple certificate above, and not
          # optional. Without it the build produces no signature, and a
          # released version nobody can verify is a released version nobody can
          # install — the updater refuses unsigned updates and cannot be told
          # not to.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done

          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. The update this builds could never be installed by anyone."
            exit 1
          fi

          if [ "${{ runner.os }}" = "macOS" ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::notice::No Apple signing identity in the secrets — building ad-hoc signed and not notarised. Gatekeeper will warn on first launch; the release notes say how to get past it."
          fi
          npm run tauri build

      - uses: actions/upload-artifact@v5
        with:
          name: amberbeam-${{ matrix.name }}
          path: ${{ matrix.artefact }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: installers
      - name: What was built
        run: find installers -type f | sort

      # The notes are cut out of the changelog rather than kept beside it.
      # Two places to write the same thing is two places to write it
      # differently, and the one nobody reads is always the one that is right.
      - name: The notes for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## $version" '
            $0 ~ "^## " { inside = ($0 == want || index($0, want " ") == 1); next }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has nothing under $version"; exit 1; }
          cat >> notes.md <<'NOTE'

          ---

          **macOS:** this build is ad-hoc signed and **not notarised** — there is
          no paid Apple membership behind this project. On first launch,
          right-click the app and choose *Open*, then confirm. After that it
          starts normally.

          **Windows and Linux:** built by CI on every release. The Debian
          package has been installed into a clean Debian 12 and checked — right
          dependencies, nothing missing, everything where it belongs — but the
          window itself has not been seen open on a real Linux machine, and
          Windows is untested beyond building. Reports are welcome.

          Full notes: [CHANGELOG.md](https://github.com/sphings79/amberbeam/blob/main/CHANGELOG.md) ·
          [auf Deutsch](https://github.com/sphings79/amberbeam/blob/main/CHANGELOG.de.md)
          NOTE
          sed -i 's/^          //' notes.md
          echo "--- notes ---"; cat notes.md

      # Pre-release until 1.0, and that is a promise about the state of the
      # program rather than a technicality. The update notice in the program
      # reads pre-releases on purpose, so this does not silence it.
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          prerelease: true
          draft: false
          body_path: notes.md
          fail_on_unmatched_files: true

  # The manifest the program reads to find out that this release exists.
  #
  # It lives on a branch of its own rather than in a release of its own,
  # because a release called "updates" sitting among the version numbers is a
  # thing every visitor has to work out and ignore. The branch is machine
  # territory: one file, rewritten every time, and main never hears about it.
  #
  # Nothing here is trusted on its own. The signatures were made in the build
  # above with a key that is not in this repository, and the program refuses
  # anything that does not match the public key it was built with — so a
  # manifest pointing somewhere else buys an attacker nothing.
  manifest:
    name: Update manifest
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: installers

      - name: Write it out of what was actually signed
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" "$GITHUB_REF_NAME" <<'PY'
          import json, os, pathlib, sys
          from datetime import datetime, timezone

          version, tag = sys.argv[1], sys.argv[2]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"

          # Which signature belongs to which machine. Taken from the file that
          # is actually there rather than from a name built up here: a guessed
          # filename that stops matching produces a manifest that looks right
          # and installs nothing.
          wanted = {
              "darwin-aarch64": ".app.tar.gz.sig",
              "windows-x86_64": "-setup.exe.sig",
              "linux-x86_64": ".AppImage.sig",
          }

          platforms = {}
          for target, ending in wanted.items():
              matches = [p for p in pathlib.Path("installers").rglob("*") if p.name.endswith(ending)]
              if len(matches) != 1:
                  raise SystemExit(f"expected one {ending}, found {len(matches)}: {matches}")
              signature = matches[0]
              platforms[target] = {
                  "signature": signature.read_text().strip(),
                  "url": f"{base}/{signature.name[:-len('.sig')]}",
              }

          notes = pathlib.Path("CHANGELOG.md").read_text()
          start = notes.find(f"## {version}")
          after = notes.find("\n## ", start + 1)
          section = notes[start:after if after != -1 else None].strip()

          pathlib.Path("latest.json").write_text(
              json.dumps(
                  {
                      "version": version,
                      "notes": section,
                      "pub_date": datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"),
                      "platforms": platforms,
                  },
                  indent=2,
              )
              + "\n"
          )
          PY
          echo "--- latest.json ---"; cat latest.json

      - name: Put it on the updates branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp latest.json /tmp/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A branch with no history in common with main: it is not a version
          # of the project, it is one generated file, and threading it through
          # main's history would say otherwise.
          git checkout --orphan updates
          git rm -rf --cached . >/dev/null
          rm -rf $(ls -A | grep -v '^\.git$') || true
          cp /tmp/latest.json latest.json
          cat > README.md <<'EOF'
          This branch holds one generated file: `latest.json`, the manifest
          AmberBeam reads to find out that a new version exists. It is rewritten
          by the release workflow and has no history worth reading.

          The manifest is not what makes an update trustworthy. Every download
          is checked against the public key built into the program, so pointing
          this file somewhere else achieves nothing without the private key.
          EOF
          git add latest.json README.md
          git commit -m "Manifest for ${GITHUB_REF_NAME}"
          git push --force origin updates
