name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The core is ordinary Rust and has nothing to do with macOS. Running it on
  # Linux keeps that honest: the day it stops building here, a dependency on the
  # platform has crept in — and the container build of M7 would be the next
  # thing to break.
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package amberbeam-core --check
      - run: cargo clippy --package amberbeam-core --all-targets -- -D warnings
      - run: cargo test --package amberbeam-core
      # The protocol code is only worth as much as the server it was tried
      # against. This is the same script and the same image used on the
      # developer's machine.
      - name: Start an SFTP server
        run: dev/test-sftp-server.sh start
      - name: Test against a real SFTP server
        run: cargo test --package amberbeam-core --test sftp
        env:
          AMBERBEAM_TEST_SFTP: 127.0.0.1:2222
      - name: Stop the SFTP server
        if: always()
        run: dev/test-sftp-server.sh stop

  frontend:
    name: Frontend and seams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Language files complete
        run: npm run check:lang
      - name: No access to Tauri outside the bridge
        run: npm run check:seams
      - run: npm run check
      # Both bridge implementations have to compile, or the second one is
      # dead weight that nobody notices rotting.
      - name: Build the desktop shell
        run: npm run build
      - name: Build the container shell
        run: npm run build
        env:
          AMBERBEAM_SHELL: web

  # One job per platform the client ships on. Each builds the native bundle of
  # its own system: .dmg on macOS, .msi and the NSIS installer on Windows,
  # .deb, .rpm and AppImage on Linux. The container build arrives with M7.
  app:
    name: App (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
            artefact: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: Windows
            artefact: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            name: Linux
            artefact: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.os }}
      # Tauri draws its window with the system webview. macOS and Windows carry
      # one; on Linux it has to be installed.
      - name: System libraries for the webview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      - name: Build the app and its installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v5
        with:
          name: amberbeam-${{ matrix.name }}
          path: ${{ matrix.artefact }}
          if-no-files-found: error
