[package]
name = "amberbeam-core"
description = "Protocol and transfer core of AmberBeam. Free of any UI or platform shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
russh.workspace = true
russh-sftp.workspace = true
dirs.workspace = true
keyring.workspace = true
quick-xml.workspace = true
ring.workspace = true
rustls-native-certs.workspace = true
sha2.workspace = true
suppaftp.workspace = true
# Watching a local directory. Its default feature set is exactly the one
# backend this needs per platform — FSEvents on macOS, inotify on Linux,
# ReadDirectoryChangesW on Windows — so there is nothing to turn off.
notify = "8.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
