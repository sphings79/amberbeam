[package]
name = "amberbeam-serve"
description = "The container shell of AmberBeam: the same commands over HTTP and a WebSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "amberbeam-serve"
path = "src/main.rs"

[dependencies]
amberbeam-core.workspace = true
amberbeam-commands.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
# Random for session tokens and a constant-time comparison for the password.
# Already a direct dependency of the core, so this costs nothing in the binary.
ring.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs"] }
# The two adapters between an HTTP body and the core's readers and writers.
# Already in the tree through axum, so declaring it costs nothing in the
# binary and saves writing a stream by hand.
tokio-util = { version = "0.7", features = ["io"] }
# For the `Stream` trait alone, to read a request body chunk by chunk. Also
# already in the tree; the combinator crate on top of it is not, and is not
# needed for a loop this short.
futures-core = "0.3"
